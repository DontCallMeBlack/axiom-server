<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiom - Recruit Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0c0d0e] text-slate-100 font-sans flex items-center justify-center p-6 relative overflow-hidden">
  
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-amber-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="bg-[#121416] border border-slate-800 rounded-2xl shadow-2xl p-8 w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 mb-2">AXIOM</h1>
      <p class="text-sm text-slate-400 font-medium uppercase tracking-widest">Recruit Application</p>
    </div>

    <form id="signup-form" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Account Username</label>
        <input type="text" id="username" required class="w-full bg-[#0a0b0c] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-amber-500 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" required class="w-full bg-[#0a0b0c] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-amber-500 transition">
      </div>

      <div class="pt-4 border-t border-slate-800">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Main Character Name</label>
        <input type="text" id="char_name" required class="w-full bg-[#0a0b0c] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-amber-500 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Primary Class</label>
        <select id="game_class" required class="w-full bg-[#0a0b0c] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-amber-500 transition appearance-none">
          <option value="warrior">Warrior</option>
          <option value="druid">Druid</option>
          <option value="mage">Mage</option>
          <option value="ranger">Ranger</option>
          <option value="rogue">Rogue</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-black text-lg py-3 rounded-xl mt-6 transition active:scale-95 shadow-[0_0_15px_rgba(217,119,6,0.3)]">
        SUBMIT APPLICATION
      </button>

      <div class="text-center mt-4">
        <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition">Return to Login</a>
      </div>
    </form>

    <div id="success-msg" class="hidden text-center py-8">
      <div class="text-4xl mb-4">🛡️</div>
      <h2 class="text-xl font-bold text-emerald-400 mb-2">Application Received</h2>
      <p class="text-sm text-slate-400">Your application has been sent to the Gatekeeper. Please wait for an Officer to approve your ledger access.</p>
      <a href="index.html" class="inline-block mt-6 px-6 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-bold text-slate-200 transition">Go to Dashboard</a>
    </div>
  </div>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault(); 
      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        char_name: document.getElementById('char_name').value,
        game_class: document.getElementById('game_class').value
      };
      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (response.ok) {
          document.getElementById('signup-form').classList.add('hidden');
          document.getElementById('success-msg').classList.remove('hidden');
        } else {
          alert("Server rejected the application. Check class restrictions.");
        }
      } catch (err) {
        console.error("Backend offline or unreachable:", err);
        alert("Failed to connect to the Axiom server.");
      }
    });
  </script>
</body>
</html>
